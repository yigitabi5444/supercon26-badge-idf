<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Badge</title>
<style>
body{font-family:sans-serif;margin:1em auto;max-width:62em;padding:0 1em}
#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
canvas{width:100%;border:3px solid #ddd;box-sizing:border-box}
#g canvas{cursor:pointer}
#g canvas.cur{border-color:#d00}
#p{max-width:480px}
</style></head><body>
<h2>Badge</h2>
<p id="st">loading…</p>
<div id="g"></div>
<p><button onclick="fetch('/rick',{method:'POST'}).then(r=>st(r.ok?'Rickrolling (about 15 frames), then back to the current image.':'Error'))">Rickroll</button>
<button onclick="fetch('/snake',{method:'POST'}).then(r=>st(r.ok?'Snake: buttons 1-4 = left, up, down, right.':'Error'))">Snake</button></p>
<h3>Upload</h3>
<p><input type="file" id="f" accept="image/*"> <label><input type="checkbox" id="d" checked> dither</label></p>
<p><canvas id="p" width="960" height="672"></canvas></p>
<p>to slot <select id="s"></select> <button id="u" disabled>Upload and show</button></p>
<script>
const W=960,H=672,P=W*H/8,PAL=[[0,0,0],[255,255,255],[255,0,0]]; // black, white, red
const $=id=>document.getElementById(id),st=t=>$('st').textContent=t;

// RGBA pixels -> black plane + red plane (MONO_HLSB, 1 = ink): nearest colour, optional Floyd-Steinberg
function pack(px,dither){
  const e=Float32Array.from(px),out=new Uint8Array(2*P);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=y*W+x,o=4*i;
    let k=0,best=1e9;
    PAL.forEach((c,j)=>{const d=(e[o]-c[0])**2+(e[o+1]-c[1])**2+(e[o+2]-c[2])**2;if(d<best){best=d;k=j}});
    if(k==0)out[i>>3]|=0x80>>(i&7);
    if(k==2)out[P+(i>>3)]|=0x80>>(i&7);
    if(dither)for(let c=0;c<3;c++){
      const err=e[o+c]-PAL[k][c];
      if(x+1<W)e[o+4+c]+=err*7/16;
      if(y+1<H){if(x>0)e[o+4*W-4+c]+=err*3/16;e[o+4*W+c]+=err*5/16;if(x+1<W)e[o+4*W+4+c]+=err/16}
    }
  }
  return out;
}
// planes -> full size canvas
function render(cv,b){
  const x=cv.getContext('2d'),d=x.createImageData(W,H);
  for(let i=0;i<W*H;i++){const m=0x80>>(i&7),c=b[i>>3]&m?PAL[0]:b[P+(i>>3)]&m?PAL[2]:PAL[1];d.data.set(c,4*i);d.data[4*i+3]=255}
  x.putImageData(d,0,0);
}

let L,cvs=[],planes;
const off=document.createElement('canvas');off.width=W;off.height=H;
const mark=()=>cvs.forEach((c,i)=>c.className=i==L.cur?'cur':'');
async function load(msg){
  L=await(await fetch('/list')).json();
  const used=k=>L.valid>>k&1;
  $('s').innerHTML='';$('g').innerHTML='';cvs=[];
  for(let k=0;k<L.nslot;k++)$('s').add(new Option((k+1)+(used(k)?' (used)':' (empty)'),k));
  $('s').value=[...Array(L.nslot).keys()].find(k=>!used(k))??0;
  for(let i=0;i<L.ndef+L.nslot;i++){
    if(i>=L.ndef&&!used(i-L.ndef))continue;
    const c=cvs[i]=document.createElement('canvas');c.width=240;c.height=168;
    c.title=i<L.ndef?'built-in '+(i+1):'slot '+(i-L.ndef+1);
    c.onclick=()=>show(i);
    $('g').append(c);
  }
  mark();st(msg);
  for(const i in cvs){ // one at a time, the badge serves one request at a time anyway
    render(off,new Uint8Array(await(await fetch('/img?i='+i)).arrayBuffer()));
    cvs[i].getContext('2d').drawImage(off,0,0,240,168);
  }
}
async function show(i){
  const r=await fetch('/show?i='+i,{method:'POST'});
  if(r.ok){L.cur=i;mark()}
  st(r.ok?'Refreshing the panel, this takes about 30 s.':'Error '+r.status);
}
$('f').onchange=async()=>{
  const f=$('f').files[0];if(!f)return;
  const img=await createImageBitmap(f),c=$('p'),x=c.getContext('2d');
  const s=Math.min(W/img.width,H/img.height),w=img.width*s,h=img.height*s;
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(img,(W-w)/2,(H-h)/2,w,h);
  planes=pack(x.getImageData(0,0,W,H).data,$('d').checked);
  render(c,planes);$('u').disabled=false;
};
$('d').onchange=()=>$('f').onchange();
$('u').onclick=async()=>{
  $('u').disabled=true;st('Uploading…');
  const r=await fetch('/upload?s='+$('s').value,{method:'POST',body:planes});
  $('u').disabled=false;
  if(r.ok)load('Uploaded. Refreshing the panel, this takes about 30 s.');else st('Upload failed: '+await r.text());
};
load('Tap an image to put it on the badge.');
</script>
</body></html>
